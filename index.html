<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>STAATUS Content</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: fixed left rail of sections, one panel on the right made of square-edged modules.
   Black and white only. Filled = built, outlined = placeholder. */
:root {
  --bg: #ffffff;
  --fg: #0a0a0a;
  --mute: #6b6b6b;
  --line: #0a0a0a;
  --soft: #f2f2f2;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0a0a0a; --fg: #f5f5f5; --mute: #9a9a9a; --line: #f5f5f5; --soft: #181818; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0a0a0a; --fg: #f5f5f5; --mute: #9a9a9a; --line: #f5f5f5; --soft: #181818; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
a { color: inherit; }
button { font: inherit; color: inherit; }

.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--line); padding: 20px 0; position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow-y: auto; }
.brand { padding: 0 20px 18px; border-bottom: 1px solid var(--line); }
.brand h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.brand p { margin: 8px 0 0; font-family: var(--font-mono); font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 0.06em; }
.group { padding: 14px 0 0; }
.group > span { display: block; padding: 0 20px 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
.nav { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 7px 20px; cursor: pointer; font-weight: 500; text-decoration: none; }
.nav:hover { background: var(--soft); }
.nav[aria-current="page"] { background: var(--fg); color: var(--bg); }
.nav .arrow { float: right; font-family: var(--font-mono); }
.nav:focus-visible, .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }

main { padding: 28px max(24px, env(safe-area-inset-right, 0px)) 60px 32px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 24px; }
.top h2 { margin: 0; font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -0.03em; line-height: 1; text-wrap: balance; }
.top p { margin: 8px 0 0; color: var(--mute); max-width: 60ch; }
.stamp { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); text-align: right; }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.mod { grid-column: span 6; border: 1px solid var(--line); padding: 16px 18px 18px; min-width: 0; }
.mod.wide { grid-column: span 12; }
.mod.third { grid-column: span 4; }
.mod.placeholder { border-style: dashed; }
.mod header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.mod h3 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
.tag { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid var(--line); padding: 2px 6px; white-space: nowrap; }
.tag.fill { background: var(--fg); color: var(--bg); }

ul.rows { list-style: none; margin: 0; padding: 0; }
ul.rows li { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-top: 1px solid var(--soft); }
ul.rows li:first-child { border-top: 0; padding-top: 0; }
ul.rows .l { min-width: 0; }
ul.rows .r { font-family: var(--font-mono); font-size: 12px; color: var(--mute); text-align: right; white-space: nowrap; }
.sub { display: block; color: var(--mute); font-size: 13px; }
.note { margin: 12px 0 0; color: var(--mute); font-size: 13px; }

.wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--soft); vertical-align: top; }
td.blank { color: var(--mute); font-family: var(--font-mono); }
td.num, th.num { font-variant-numeric: tabular-nums; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border: 1px solid var(--line); }
.stat { padding: 14px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); }

.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.link { display: block; text-decoration: none; border: 1px solid var(--line); padding: 14px; }
.link b { display: block; font-size: 16px; }
.link span { display: block; margin-top: 4px; font-size: 13px; color: var(--mute); }
.link em { display: block; margin-top: 10px; font-style: normal; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
a.link:hover { background: var(--fg); color: var(--bg); }
a.link:hover span { color: var(--bg); }
.link.off { border-style: dashed; color: var(--mute); }

.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; border: 1px solid var(--line); }
.lane { border-right: 1px solid var(--line); padding: 12px; min-width: 0; }
.lane:last-child { border-right: 0; }
.lane h4 { margin: 0 0 8px; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; }
.lane b { font-size: 24px; font-weight: 800; }

.check { list-style: none; margin: 0; padding: 0; }
.check li { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--soft); }
.check li:first-child { border-top: 0; padding-top: 0; }
.box { flex: none; width: 14px; height: 14px; border: 1.5px solid var(--fg); margin-top: 4px; }
.box.on { background: var(--fg); }
.box.half { background: linear-gradient(135deg, var(--fg) 50%, transparent 50%); }

.mod.linked { border-left: 8px solid var(--fg); }
.btn { background: none; border: 1px solid var(--line); padding: 7px 14px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--fg); color: var(--bg); }
.igtop { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 6px; }
.igh { margin:16px 0 6px; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; opacity:.7; }
.igbars { display:grid; gap:6px; }
.igbar { display:grid; grid-template-columns:64px 1fr 44px; align-items:center; gap:10px; font-size:13px; }
.igt { height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.igt i { display:block; height:100%; background:var(--fg); border-radius:4px; }
.igv { text-align:right; opacity:.8; }
.btn:disabled { opacity:.5; cursor:default; }
button.link { text-align: left; background: none; cursor: pointer; width: 100%; }
button.link:hover { background: var(--fg); color: var(--bg); }
button.link:hover span { color: var(--bg); }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
input, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 0; padding: 5px 8px; min-width: 0; }
td input[type="text"], td input:not([type]), td input[type="number"] { width: 100%; min-width: 90px; }
td select { max-width: 150px; }
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--fg); }

.calbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.calbar b { flex:1; text-align:center; }
.cal { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); }
.cal .ch { padding:4px 6px; font:11px ui-monospace,Menlo,monospace; color:var(--mute); border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.cal .cd { min-height:78px; padding:3px 4px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); cursor:pointer; overflow:hidden; }
.cal .cd.off { background:var(--soft); cursor:default; }
.cal .cd.today { background:var(--soft); }
.cal .dn { display:block; font-size:11px; color:var(--mute); }
.cal .cd.today .dn { color:var(--fg); font-weight:700; }
.cal .ev { display:block; margin-top:2px; padding:1px 4px; font-size:11px; line-height:1.3; background:var(--fg); color:var(--bg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:600px) { .cal .cd { min-height:56px; } .cal .ev { font-size:10px; } }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
form.inline input { flex: 1 1 140px; }
.btn.x { padding: 2px 8px; }
.tile { position: relative; aspect-ratio: 1; border: 1px solid var(--line); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .btn { position: absolute; top: 4px; right: 4px; background: var(--bg); }
.drop { border: 1px dashed var(--fg); padding: 16px; text-align: center; color: var(--mute); cursor: pointer; margin-top: 10px; font-size: 13px; }
.drop.over { background: var(--soft); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.fields label { display: block; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mute); }
.fields input { display: block; width: 100%; margin-top: 4px; font-size: 15px; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 0 0; }
  .brand { padding: 0 max(16px, env(safe-area-inset-left, 0px)) 12px; }
  .group { display: inline-block; vertical-align: top; padding: 10px 0 0; }
  .rail-nav { overflow-x: auto; white-space: nowrap; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-bottom: 10px; }
  .group > span { padding: 0 12px 4px 0; }
  .nav { display: inline-block; width: auto; padding: 6px 12px 6px 0; margin-right: 4px; }
  .nav[aria-current="page"] { padding: 6px 10px; }
  .nav .arrow { float: none; margin-left: 6px; }
  main { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .mod, .mod.third { grid-column: span 12; }
  .stamp { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) { .nav { transition: background 0.12s; } }
/* ---- Content tab ---- */
.seg { display: flex; gap: 0; border: 1px solid var(--line); width: max-content; max-width: 100%; margin-bottom: 18px; overflow-x: auto; }
.seg button { white-space: nowrap; }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 8px 18px; cursor: pointer; font-weight: 500; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.ccal .cd { min-height: 124px; cursor: pointer; position: relative; padding: 4px 6px; }
.ccal .cd.off { cursor: default; }
.ccal .cd:hover { background: var(--soft); }
.ccal .cd.sel { outline: 2px solid var(--fg); outline-offset: -2px; }
.ccal .cd.shootday { background: repeating-linear-gradient(135deg, transparent 0 7px, var(--soft) 7px 8px); }
.ccal .dl { position: absolute; top: 4px; right: 5px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.chip.shoot { background: var(--bg); border-style: dashed; }
.cstack { display: grid; gap: 16px; min-width: 0; }
.cstack > .mod, .crow > .mod { grid-column: auto; }
.crow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.lab { margin: 0 0 6px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.upnext.sched { margin-bottom: 14px; }
.stale { display: grid; gap: 8px; }
.stale div { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--soft); padding-top: 8px; }
.stale div:first-child { border-top: 0; padding-top: 0; }
.stale span { color: var(--mute); font-size: 13px; text-align: right; }
.batch[data-day] { cursor: pointer; }
.gwrap { border: 1px solid var(--line); margin-bottom: 8px; overflow: hidden; }
.gwrap canvas { display: block; cursor: grab; touch-action: none; max-width: 100%; }
@media (pointer: coarse) { .gwrap canvas { touch-action: pan-y; } }
.legend i.s { background: repeating-linear-gradient(135deg, var(--fg) 0 2px, transparent 2px 4px); }
.legend i.sq { background: var(--fg); }
.legend i.o { border-radius: 50%; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.pcard { min-width: 0; }
@media (max-width: 820px) { .crow { grid-template-columns: minmax(0, 1fr); } .pgrid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .ccal .cd { min-height: 70px; padding: 3px; } .ccal .dl { display: none; } .chip { font-size: 10px; padding: 0 3px; } }
.ccal .cd .dn { margin-bottom: 2px; }
.chip { display: block; margin-top: 2px; padding: 1px 5px; font-size: 11px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; border: 1px solid var(--fg); width: 100%; text-align: left; background: var(--bg); color: var(--fg); }
.chip.post { background: var(--fg); color: var(--bg); }
.chip.done { background: var(--soft); color: var(--mute); border-color: var(--mute); text-decoration: line-through; }
.chip.past { background: var(--fg); color: var(--bg); opacity: .55; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin-top: 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--fg); vertical-align: -2px; margin-right: 5px; }
.legend i.f { background: var(--fg); }
.upnext { list-style: none; margin: 0; padding: 0; counter-reset: n; }
.upnext li { counter-increment: n; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; padding: 10px 0; border-top: 1px solid var(--soft); align-items: start; }
.upnext li:first-child { border-top: 0; padding-top: 0; }
.upnext li::before { content: counter(n); font-family: var(--font-mono); font-size: 12px; color: var(--mute); padding-top: 2px; }
.upnext b { cursor: pointer; font-weight: 600; }
.upnext b:hover { text-decoration: underline; }
.why { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.why span { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--mute); color: var(--mute); padding: 0 5px; }
.batch { padding: 8px 0; border-top: 1px solid var(--soft); }
.batch:first-child { border-top: 0; padding-top: 0; }
.batch b { display: flex; justify-content: space-between; gap: 10px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.pill { background: none; border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; font-size: 13px; }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.filters select, .filters input[type="search"] { padding: 6px 8px; }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.idea { text-align: left; background: none; border: 1px solid var(--line); padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.idea:hover { background: var(--fg); color: var(--bg); }
.idea:hover .meta, .idea:hover .ex { color: var(--bg); }
.idea b { font-size: 15px; line-height: 1.25; }
.idea .ex { font-size: 12.5px; color: var(--mute); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.idea .meta { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); margin-top: auto; }
.idea.planned { border-left: 6px solid var(--fg); }
#drawer { position: fixed; inset: 0; z-index: 50; display: none; }
#drawer.on { display: block; }
#drawer .veil { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#drawer .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto; padding: 20px 22px 40px; }
#drawer h3 { margin: 0 28px 4px 0; font-size: 22px; letter-spacing: -.02em; line-height: 1.15; }
#drawer .sheet.wide { width: min(960px, 100%); }
.tgrid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; margin-top: 14px; align-items: start; }
@media (max-width: 780px) { .tgrid { grid-template-columns: 1fr; } }
.tpanel { display: flex; flex-direction: column; gap: 10px; }
.tpanel .lab { margin: 0 0 6px; }
.tpills { display: flex; flex-wrap: wrap; gap: 6px; }
.tdrop { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; color: inherit; border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; font: inherit; font-size: 13px; text-align: left; }
.tdrop span:last-child { font-family: var(--font-mono); font-size: 11px; color: var(--mute); }
.tbody { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 2px; }
.tpanel textarea { width: 100%; min-height: 110px; box-sizing: border-box; background: none; color: inherit; border: 1px solid var(--line); padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; }
#drawer .x { position: absolute; top: 14px; right: 14px; }
.dfields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.dfields label { display: block; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); }
.dfields input { width: 100%; margin-top: 4px; font-size: 15px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; }
.tags span { font-size: 11px; border: 1px solid var(--line); padding: 1px 6px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.cover { position: relative; display: block; width: 100%; max-width: 340px; border: 1px solid var(--line); background: var(--soft); margin: 12px 0 6px; text-decoration: none; color: var(--fg); }
.pcard .cover { max-width: none; margin-top: 0; }
.cover img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: cover; }
.cover .play { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 10px; background: var(--fg); color: var(--bg); font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.cover .nocover { display: flex; align-items: center; justify-content: center; min-height: 120px; padding: 16px; text-decoration: underline; }
.emb { width: 100%; max-width: 340px; height: 640px; border: 1px solid var(--line); background: #fff; display: block; margin: 12px 0 6px; }
.pcard .emb { max-width: none; margin-top: 0; }
#daymodal { position: fixed; inset: 0; z-index: 40; display: none; }
#daymodal.on { display: block; }
#daymodal .veil { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
#daymodal .dm { position: absolute; top: 2vh; left: 50%; transform: translateX(-50%); width: min(1500px, 96vw); max-height: 96vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); padding: 20px 24px 28px; }
#daymodal h3 { margin: 0 32px 4px 0; font-size: 22px; letter-spacing: -.02em; }
#daymodal .x { position: absolute; top: 12px; right: 12px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 24px; align-items: start; }
.dcard { min-width: 0; border-top: 2px solid var(--fg); padding-top: 10px; }
.dhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.dhead b { cursor: pointer; font-size: 17px; line-height: 1.25; }
.dhead b:hover { text-decoration: underline; }
.dhead .btn { flex-shrink: 0; }
.dtext { margin: 6px 0 0; }
.cover.wide { max-width: 540px; }

.shell.rail-collapsed { grid-template-columns: minmax(0, 1fr); }
.shell.rail-collapsed > .rail { display: none; }
#rail-toggle { margin-bottom: 8px; }
.hq-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0; }
.hq-board { display: grid; gap: 8px; overflow-x: auto; margin: 10px 0; grid-template-columns: repeat(3, minmax(155px, 1fr)); }
.pb-board { grid-template-columns: repeat(4, minmax(215px, 1fr)); }
.hq-column { border: 1px solid var(--line); padding: 8px; min-height: 80px; }
.hq-column h4 { margin: 0 0 8px; }
.hq-card { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.hq-card textarea, .hq-card input:not([type=radio]), .hq-card select { width: 100%; min-width: 0; }
.hq-card fieldset { min-width: 0; padding: 6px; border: 1px solid var(--line); }
.hq-option { display: flex; gap: 4px; margin-bottom: 4px; }
[data-pbdrag] { cursor: grab; }
.pr-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.pr-fields label { min-width: 0; }
.pr-card > .btn, .hq-card > [data-del] { justify-self: start; }

/* ---- Team tab ---- */
.tmlanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); }
.tmlane { padding: 12px 14px; min-width: 0; border-right: 1px solid var(--line); }
.tmlane:last-child { border-right: 0; }
.tmlane h4 { margin: 0 0 10px; font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; }
.tmta { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); resize: vertical; }
.tmol { margin: 0; padding-left: 20px; }
.tmol li { padding: 6px 0; border-top: 1px solid var(--soft); }
.tmol li:first-child { border-top: 0; padding-top: 0; }
.tmdollar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.tmdollar input { flex: 0 1 160px; }
.tmsync { margin: 0; padding-left: 22px; }
.tmsync > li { padding: 10px 0; border-top: 1px solid var(--soft); }
.tmsync > li:first-child { border-top: 0; padding-top: 0; }
.tmsync > li > b { display: block; margin-bottom: 4px; }
.tmmini { list-style: none; margin: 0; padding: 0; }
.tmmini li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; font-size: 14px; }
.tmmini li span { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); text-align: right; white-space: nowrap; }
.tmgo { background: none; border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; font-size: 13px; }
.tmgo:hover { background: var(--fg); color: var(--bg); }
.tmgo:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
@media (max-width: 700px) {
  .tmlanes { grid-template-columns: minmax(0, 1fr); }
  .tmlane { border-right: 0; border-bottom: 1px solid var(--line); }
  .tmlane:last-child { border-bottom: 0; }
  .tmmini li { flex-direction: column; gap: 0; }
  .tmmini li span { text-align: left; white-space: normal; }
}
.tmmini li.tm-problem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; }
.tm-problem > .sub { grid-column: 1 / -1; overflow-wrap: anywhere; }


/* ---- STAATUS HQ liquid glass (global, Teo, Nov 22 2026). ---- */
html {
  color-scheme: dark;
  min-height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #354e69;
}
body {
  --g-void: #1d2b3a;
  --g-bg: #354e69;
  --g-bg-mid: #3e5c7a;
  --g-glow: #7b9eb9;
  --g-glow-deep: #2a4158;
  --g-cream: #ffffe8;
  --g-text: #ffffe8;
  --g-text-soft: rgba(255, 255, 232, 0.82);
  --g-mute: rgba(255, 255, 232, 0.68);
  --g-glass: rgba(255, 255, 232, 0.12);
  --g-glass-2: rgba(255, 255, 232, 0.16);
  --g-glass-hover: rgba(255, 255, 232, 0.22);
  --g-stroke: rgba(255, 255, 232, 0.22);
  --g-stroke-strong: rgba(255, 255, 232, 0.38);
  --g-highlight: rgba(255, 255, 232, 0.42);
  --g-blur: 22px;
  --g-radius: 20px;
  --g-radius-sm: 16px;
  --g-pill: 999px;
  --g-space-1: 6px;
  --g-space-2: 10px;
  --g-space-3: 16px;
  --g-space-4: 24px;
  --g-space-5: 36px;
  --g-font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --g-hand: "Caveat", cursive;
  --g-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --g-move: 220ms;
  --g-move-slow: 380ms;
  --g-shadow: 0 12px 40px rgba(29, 43, 58, 0.45);
  --g-glow-shadow: 0 0 0 1px rgba(255, 255, 232, 0.35), 0 8px 28px rgba(53, 78, 105, 0.45);
  --bg: var(--g-bg);
  --fg: var(--g-text);
  --mute: var(--g-mute);
  --line: var(--g-stroke);
  --soft: rgba(255, 255, 232, 0.10);
  --font-body: var(--g-font);
  --font-mono: var(--g-hand);
  color-scheme: dark;
  background: #354e69;
  color: var(--g-text);
  font-family: var(--g-font);
  font-weight: 400;
  min-height: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}

/* Document-tall glow layer so the blue wash covers the full page, not just the first viewport. */
body::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  min-height: 100%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(980px 620px at 12% -8%, rgba(123, 158, 185, 0.48), transparent 58%),
    radial-gradient(820px 520px at 96% 8%, rgba(42, 65, 88, 0.50), transparent 55%),
    radial-gradient(900px 560px at 42% 58%, rgba(62, 92, 122, 0.36), transparent 70%),
    radial-gradient(740px 640px at 72% 100%, rgba(29, 43, 58, 0.42), transparent 62%),
    linear-gradient(180deg, var(--g-bg-mid) 0%, var(--g-bg) 46%, var(--g-void) 100%);
  background-attachment: scroll;
}

body .shell {
  background: transparent;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  align-items: stretch;
}
body .rail {
  border-right: 1px solid var(--g-stroke);
  background: rgba(29, 43, 58, 0.45);
  backdrop-filter: blur(var(--g-blur)) saturate(1.4);
  -webkit-backdrop-filter: blur(var(--g-blur)) saturate(1.4);
  box-shadow: inset -1px 0 0 var(--g-highlight);
  align-self: stretch;
  min-height: 100%;
  height: auto;
  max-height: none;
  position: sticky;
  top: 0;
}
body .brand { border-bottom-color: var(--g-stroke); padding: 4px 22px 20px; }
body .brand h1 { letter-spacing: -0.03em; font-weight: 700; font-family: var(--g-font); }
body .brand p { color: var(--g-mute); font-family: var(--g-hand); font-weight: 400; font-size: 13px; text-transform: none; letter-spacing: normal; }
body .group > span { color: var(--g-mute); padding: 0 22px 8px; font-family: var(--g-hand); font-weight: 400; font-size: 12.5px; text-transform: none; letter-spacing: normal; }
body .nav {
  margin: 2px 10px;
  width: calc(100% - 20px);
  padding: 8px 14px;
  border-radius: 12px;
  color: var(--g-text-soft);
  font-weight: 400;
  transition: background var(--g-move) var(--g-ease), color var(--g-move), box-shadow var(--g-move), transform var(--g-move) var(--g-ease);
}
body .nav:hover {
  background: rgba(255, 255, 232, 0.10);
  color: var(--g-text);
  transform: translateY(-1px);
}
body .nav[aria-current="page"] {
  background: var(--g-cream);
  color: var(--g-bg);
  box-shadow: var(--g-glow-shadow);
  font-weight: 700;
}
body .nav:focus-visible,
body .btn:focus-visible,
body .pill:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(123, 158, 185, 0.5);
}

body main { position: relative; padding: 32px max(28px, env(safe-area-inset-right, 0px)) 72px 36px; }
body .top {
  border-bottom-color: var(--g-stroke);
  padding-bottom: 20px;
  margin-bottom: 28px;
}
body .top h2 { letter-spacing: -0.03em; font-weight: 700; font-family: var(--g-font); }
body .top p { color: var(--g-mute); font-family: var(--g-font); font-weight: 700; font-style: italic; letter-spacing: -0.02em; text-transform: none; }
body .stamp { color: var(--g-mute); font-family: var(--g-hand); font-weight: 400; font-size: 13px; text-transform: none; letter-spacing: normal; }
body .grid { gap: 20px; }

body .mod,
body .mod.placeholder {
  background: var(--g-glass);
  backdrop-filter: blur(var(--g-blur)) saturate(1.45);
  -webkit-backdrop-filter: blur(var(--g-blur)) saturate(1.45);
  border: 1px solid var(--g-stroke);
  border-radius: var(--g-radius);
  box-shadow: var(--g-shadow), inset 0 1px 0 var(--g-highlight);
  padding: 22px 22px 24px;
  animation: g-fade-up var(--g-move-slow) var(--g-ease) both;
}
body .mod:nth-child(1) { animation-delay: 40ms; }
body .mod:nth-child(2) { animation-delay: 90ms; }
body .mod:nth-child(3) { animation-delay: 140ms; }
body .mod:nth-child(4) { animation-delay: 190ms; }
body .mod:nth-child(5) { animation-delay: 240ms; }
body .mod.linked { border-left: 4px solid var(--g-cream); }

body .mod h3 { letter-spacing: -0.02em; font-weight: 700; font-family: var(--g-font); }
body .tag {
  border-color: var(--g-stroke);
  border-radius: var(--g-pill);
  padding: 3px 8px;
  color: var(--g-mute);
  font-family: var(--g-hand);
  font-weight: 400;
  font-size: 12px;
  text-transform: none;
  letter-spacing: normal;
}
body .tag.fill {
  background: var(--g-cream);
  color: var(--g-bg);
  border-color: var(--g-cream);
  box-shadow: 0 0 16px rgba(123, 158, 185, 0.35);
}

body ul.rows li { border-top: none; }
body ul.rows .r { color: var(--g-mute); font-family: var(--g-hand); font-size: 14px; text-transform: none; letter-spacing: normal; }
body .note { color: var(--g-mute); }
body th { border-bottom: none; color: var(--g-mute); font-family: var(--g-hand); font-weight: 400; font-size: 12.5px; text-transform: none; letter-spacing: normal; }
body td { border-bottom: none; }

body .links { gap: 16px; }
body .link {
  background: var(--g-glass);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--g-stroke);
  border-radius: var(--g-radius);
  box-shadow: inset 0 1px 0 var(--g-highlight);
  color: var(--g-text);
  transition: transform var(--g-move) var(--g-ease), background var(--g-move), box-shadow var(--g-move), border-color var(--g-move);
}
body .link b { font-weight: 700; font-family: var(--g-font); }
body .link span {
  font-family: var(--g-font);
  font-weight: 700;
  font-style: italic;
  letter-spacing: -0.02em;
  text-transform: none;
  color: var(--g-mute);
}
body .link em {
  font-family: var(--g-hand);
  font-weight: 400;
  font-style: normal;
  font-size: 13px;
  text-transform: none;
  letter-spacing: normal;
  color: var(--g-mute);
}
body a.link:hover,
body button.link:hover {
  background: var(--g-glass-hover);
  color: var(--g-text);
  transform: translateY(-3px);
  box-shadow: var(--g-glow-shadow);

}
body a.link:hover span,
body button.link:hover span { color: var(--g-text-soft); }
body .link.off { color: var(--g-mute); }

body .btn {
  background: rgba(255, 255, 232, 0.10);
  border: 1px solid var(--g-stroke);
  border-radius: var(--g-pill);
  color: var(--g-text);
  padding: 8px 16px;
  font-weight: 700;
  font-family: var(--g-font);
  transition: transform var(--g-move) var(--g-ease), background var(--g-move), box-shadow var(--g-move), border-color var(--g-move), color var(--g-move);
}
body .btn:hover {
  background: rgba(255, 255, 232, 0.22);
  color: var(--g-text);
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(42, 65, 88, 0.35);

body #rail-toggle {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 2;
  width: 24px;
  height: 24px;
  min-width: 24px;

  box-shadow: inset 0 1px 0 var(--g-highlight);

  font-size: 0;

  font-size: 18px;
  font-weight: 400;
  line-height: 22px;

  background: rgba(255, 255, 232, 0.22);

body .pill {
  background: rgba(255, 255, 232, 0.08);

body .filters { gap: 10px; margin-bottom: 18px; }
body input,
body select,

body form.inline { gap: 10px; margin-top: 18px; }

body .fields label,

@keyframes g-fade-up {
  from { opacity: 0; transform: translateY(10px); }

}
